<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Resource Pack...</title>
    
    <style>
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;

            /* Фирменный темный фон Minecraft (Dirt Block), созданный на чистом CSS */
            background-color: #5c3e26;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), /* Общее затемнение фона */
                linear-gradient(45deg, #735135 25%, transparent 25%, transparent 75%, #735135 75%, #735135),
                linear-gradient(45deg, #735135 25%, #47301c 25%, #47301c 75%, #735135 75%, #735135);
            background-size: 40px 40px;
            background-position: 0 0, 0 0, 20px 20px;
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin: 0;
            line-height: 1.5;
            /* Фирменная жесткая тень из Minecraft */
            text-shadow: 4px 4px 0px #3f3f3f; 
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="box" id="content">
        <div class="message-container" id="text-block">
            <h1>Thank you for downloading my resource pack!</h1>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. Автоматическое скачивание архива revil_pack.zip
            const link = document.createElement('a');
            link.href = 'revil_pack.zip';
            link.download = 'revil_pack.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 2. Через 1 секунду плавно показываем надпись
            setTimeout(function() {
                document.getElementById('text-block').classList.add('visible');
                document.title = 'Thank You!';
            }, 1000);
        };
    </script>
</body>
</html>

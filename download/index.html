<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Resource Pack...</title>
    
    <style>
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;

            /* Сохраняем пиксельный стиль для шрифта и фона */
            image-rendering: -moz-crisp-edges !important;
            image-rendering: -webkit-crisp-edges !important;
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;

            /* Сделали наложение черного цвета намного светлее (всего 35% вместо 65%) */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), 
                url('dirt_bg.png');
            
            background-repeat: no-repeat !important;
            background-size: cover !important;
            background-position: center !important;
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin: 0;
            line-height: 1.5;
            text-shadow: 4px 4px 0px #3f3f3f; 
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="box" id="content">
        <div class="message-container" id="text-block">
            <h1>Thank you for downloading my resource pack!</h1>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Автоматическое скачивание архива revil_pack.zip
            const link = document.createElement('a');
            link.href = 'revil_pack.zip';
            link.download = 'revil_pack.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Через 1 секунду плавно показываем надпись
            setTimeout(function() {
                document.getElementById('text-block').classList.add('visible');
                document.title = 'Thank You!';
            }, 1000);
        };
    </script>
</body>
</html>

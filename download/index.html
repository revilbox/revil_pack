<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Resource Pack...</title>
    
    <style>
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Настоящий, неделимый крупнопиксельный фон Minecraft */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            
            /* Чистый пиксельный код текстуры, вшитый прямо в CSS */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="4" height="4" viewBox="0 0 4 4"><rect width="4" height="4" fill="%232b1e14"/><rect x="0" y="0" width="2" height="2" fill="%2338271a"/><rect x="2" y="2" width="2" height="2" fill="%2338271a"/><rect x="1" y="1" width="1" height="1" fill="%234a3422"/><rect x="3" y="3" width="1" height="1" fill="%234a3422"/><rect x="0" y="3" width="1" height="1" fill="%231f150e"/><rect x="2" y="1" width="1" height="1" fill="%231f150e"/></svg>') !important;
            background-repeat: repeat !important;
            
            /* Вот этот параметр теперь ЖЕСТКО сделает пиксели огромными на весь экран */
            background-size: 128px 128px !important; 
            
            /* Полное отключение любого сглаживания */
            image-rendering: -moz-crisp-edges !important;
            image-rendering: -webkit-crisp-edges !important;
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
        }

        /* Оригинальное майнкрафтовское затемнение поверх пикселей */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.75) !important;
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin: 0;
            line-height: 1.5;
            text-shadow: 4px 4px 0px #3f3f3f; 
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="box" id="content">
        <div class="message-container" id="text-block">
            <h1>Thank you for downloading my resource pack!</h1>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Автоматическое скачивание архива revil_pack.zip
            const link = document.createElement('a');
            link.href = 'revil_pack.zip';
            link.download = 'revil_pack.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Через 1 секунду плавно показываем надпись
            setTimeout(function() {
                document.getElementById('text-block').classList.add('visible');
                document.title = 'Thank You!';
            }, 1000);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Resource Pack...</title>
    
    <style>
        /* Подключаем шрифт напрямую из вашего репозитория */
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            background-color: #121214; /* Глубокий темный фон */
            color: #ffffff; /* Чистый белый текст */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: normal;
            margin: 0;
            line-height: 1.5;
            /* Фирменная жесткая тень из Minecraft */
            text-shadow: 4px 4px 0px #3f3f3f; 
            /* Дополнительное сглаживание для пиксельных шрифтов */
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="box" id="content">
        <div class="message-container" id="text-block">
            <h1>Thank you for downloading my resource pack!</h1>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. Автоматическое скачивание архива revil_pack.zip
            const link = document.createElement('a');
            link.href = 'revil_pack.zip';
            link.download = 'revil_pack.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 2. Через 1 секунду плавно показываем надпись
            setTimeout(function() {
                document.getElementById('text-block').classList.add('visible');
                document.title = 'Thank You!';
            }, 1000);
        };
    </script>
</body>
</html>

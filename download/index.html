<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Resource Pack...</title>
    
    <style>
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            /* Фирменный фон Minecraft (грязевой блок) с затемнением */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" fill="%23735135"/><rect x="1" y="1" width="14" height="14" fill="%235c3e26"/><rect x="2" y="2" width="12" height="1" fill="%2347301c"/><rect x="2" y="3" width="1" height="11" fill="%2347301c"/><rect x="5" y="5" width="3" height="3" fill="%23382414"/><rect x="10" y="9" width="4" height="2" fill="%23382414"/></svg>');
            background-size: 64px 64px; /* Делаем пиксели крупными */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
            cursor: pointer; /* Показывает, что на экран можно кликнуть */
        }

        .message-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin: 0;
            line-height: 1.5;
            text-shadow: 4px 4px 0px #3f3f3f; 
            font-smooth: never;
            -webkit-font-smoothing: none;
            
            /* Запускаем покачивание текста */
            animation: minecraftSplash 1.2s infinite ease-in-out;
        }

        /* Анимация покачивания как у сплешей в главном меню */
        @keyframes minecraftSplash {
            0% { transform: scale(1); }
            50% { transform: scale(1.05) rotate(-1deg); }
            100% { transform: scale(1); }
        }

        .message-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="box" id="content">
        <div class="message-container" id="text-block">
            <h1>Thank you for downloading my resource pack!</h1>
        </div>
    </div>

    <script>
        // Функция создания оригинального звука клика кнопки Minecraft
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'triangle'; // Треугольная волна дает более ретро-звук
                oscillator.frequency.setValueAtTime(120, audioCtx.currentTime); // Базовая частота «щелчка»
                oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        // Воспроизводим звук при любом клике по экрану
        document.body.addEventListener('click', playClickSound);

        window.onload = function() {
            // 1. Автоматическое скачивание архива revil_pack.zip
            const link = document.createElement('a');
            link.href = 'revil_pack.zip';
            link.download = 'revil_pack.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 2. Через 1 секунду плавно показываем надпись
            setTimeout(function() {
                document.getElementById('text-block').classList.add('visible');
                document.title = 'Thank You!';
            }, 1000);
        };
    </script>
</body>
</html>
